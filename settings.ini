[database]
db_host = 192.168.2.5
db_port = 3306
db_user = labeling
db_password = labeling
db_name = cre_tech
assembly_table = cre_tech.gensys_assembly
main_table = cre_tech.gensys_main

[queries]
operator_check_query = SELECT 1 FROM operators.`main` WHERE operator_en = %s LIMIT 1
insert_assembly_query = INSERT INTO {table} (serial_num, po_num, operator_en, shift, date_time, customer_sn, test_rep, remarks, status) VALUES (%(serial_num)s, %(po_num)s, %(operator_en)s, %(shift)s, %(date_time)s, %(customer_sn)s, %(test_rep)s, %(remarks)s, %(status)s)
insert_main_query = INSERT INTO {main_table} (serial_num, po_num, soldering, cleaning, vi, progtest, insulation, assembly, lasermarking, fvi, packing, packaging) VALUES (%(serial_num)s, %(po_num)s, %(soldering)s, %(cleaning)s, %(vi)s, %(progtest)s, %(insulation)s, %(assembly)s, %(lasermarking)s, %(fvi)s, %(packing)s, %(packaging)s) ON DUPLICATE KEY UPDATE po_num = VALUES(po_num), soldering = VALUES(soldering), cleaning = VALUES(cleaning), vi = VALUES(vi), progtest = VALUES(progtest), insulation = VALUES(insulation), assembly = VALUES(assembly), lasermarking = VALUES(lasermarking), fvi = VALUES(fvi), packing = VALUES(packing), packaging = VALUES(packaging)
fail_count_query = SELECT COUNT(*) AS cnt FROM {table} WHERE (serial_num = %s OR serial_num LIKE %s) AND status = 0